<title>507 Mechanical Movements</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="All 507 mechanical movements from Henry T. Brown's 1868 book, with interactive simulations and notes on where each is used today.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an engineer's reference book. Index of 507 plates with search and families; each plate opens as a working bench (drawing | instrument panel). Vellum neutrals, graphite ink, brass = driver, blued steel = output. */
:root{
  --paper:#e5e9e4; --sheet:#f4f6f2; --ink:#1c2420; --muted:#5b665f; --rule:#c3cac2; --grid:#e2e7e0;
  --brass:#966215; --brass-fill:#ead3a2; --steel:#2c6283; --steel-fill:#c4d7e2;
  --part:#d8ded7; --part2:#c4ccc3; --hi:#fbfcfa;
  --f-display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-sc:"IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101513; --sheet:#161c19; --ink:#dce3dd; --muted:#8e9b93; --rule:#2c3531; --grid:#1d2521;
    --brass:#dba54a; --brass-fill:#4a3a1c; --steel:#84b8d7; --steel-fill:#1e3646;
    --part:#26302b; --part2:#313c37; --hi:#1c231f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101513; --sheet:#161c19; --ink:#dce3dd; --muted:#8e9b93; --rule:#2c3531; --grid:#1d2521;
  --brass:#dba54a; --brass-fill:#4a3a1c; --steel:#84b8d7; --steel-fill:#1e3646;
  --part:#26302b; --part2:#313c37; --hi:#1c231f; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
a{color:var(--brass)}
.wrap{max-width:1380px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,6vw,72px);line-height:.98;margin:8px 0 14px;letter-spacing:-.01em;text-wrap:balance}
h1 i{font-style:italic;color:var(--brass)}
.lede{max-width:64ch;margin:0;color:var(--muted);font-size:16px}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px 40px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--rule);margin-bottom:22px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1;font-variant-numeric:lining-nums}
.stat span{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 260px;min-width:0;font:15px var(--f-body);padding:10px 14px;border:1px solid var(--ink);border-radius:3px;background:var(--sheet);color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--brass);width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{font:500 12.5px var(--f-body);padding:5px 10px;border:1px solid var(--rule);border-radius:3px;background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip small{font-family:var(--f-mono);font-size:10.5px;color:inherit;opacity:.7;margin-left:4px}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;overflow:hidden;min-width:0}
.card:hover{border-color:var(--ink)}
.card:focus-visible,.btn:focus-visible,.chip:focus-visible,.search:focus-visible,input:focus-visible,.seg button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.thumb{display:block;width:100%;aspect-ratio:800/520;background:var(--sheet);border-bottom:1px solid var(--rule)}
.plateno{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:800/520;border-bottom:1px solid var(--rule);font-family:var(--f-display);font-size:54px;color:var(--rule);background:repeating-linear-gradient(0deg,transparent 0 19px,var(--grid) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,var(--grid) 19px 20px)}
.cbody{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px}
.cn{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cn b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--brass);line-height:1}
.badge{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--steel-fill);color:var(--ink)}
.ct{font-weight:500;font-size:13.5px;line-height:1.25}
.cc{font-size:11.5px;color:var(--muted)}
.empty{padding:40px 0;color:var(--muted)}

/* detail */
.crumbs{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.btn{font:500 13px var(--f-body);padding:7px 11px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:3px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sheet)}
.btn.primary{background:var(--ink);color:var(--sheet);min-width:78px;justify-content:center}
.btn:disabled{opacity:.4;cursor:default}
.nav{display:flex;gap:6px;align-items:center}
.nav .pos{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0 6px}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:860px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}
.sheet{position:relative;background:var(--sheet);border:1px solid var(--rule)}
.sheet canvas{display:block;width:100%;aspect-ratio:800/520;max-width:100%;touch-action:none;cursor:grab}
.sheet canvas.dragging{cursor:grabbing}
.plate{position:absolute;left:14px;top:10px;font-family:var(--f-sc);font-size:clamp(15px,2vw,20px);pointer-events:none}
.schem{margin:8px 0 0;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.hint{position:absolute;right:12px;bottom:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);pointer-events:none}
.pending{aspect-ratio:800/520;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;background:repeating-linear-gradient(0deg,transparent 0 19px,var(--grid) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,var(--grid) 19px 20px)}
.pending b{font-family:var(--f-display);font-weight:400;font-size:clamp(70px,12vw,140px);line-height:1;color:var(--rule)}
.pending span{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.text{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px 32px;margin-top:18px}
@media (max-width:760px){.text{grid-template-columns:minmax(0,1fr)}}
.text h2{grid-column:1/-1;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.text p{margin:0;max-width:65ch}
.note{display:flex;flex-direction:column;gap:12px}
.note div{font-size:14px}
.note b{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:3px 8px;border:1px solid var(--rule);border-radius:2px;color:var(--muted);cursor:pointer;background:transparent}
.panel{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);min-width:0}
.sec{padding:14px 16px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.sec:first-child{border-top:0}
.sec h3{margin:0;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl .lab{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.ctl output{font-family:var(--f-mono);font-size:12px;color:var(--brass);font-variant-numeric:tabular-nums;text-align:right}
input[type=range]{width:100%;accent-color:var(--brass);margin:0}
.seg{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{flex:1;font:500 12.5px var(--f-body);padding:6px 8px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
dl.read{display:grid;grid-template-columns:minmax(80px,1fr) minmax(0,1.5fr);gap:5px 12px;margin:0;font-size:13px}
dl.read dt{color:var(--muted)}
dl.read dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.trace{display:block;width:100%;height:110px}
.legend{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:14px;height:10px;border:1px solid var(--ink);display:inline-block}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer p{margin:0;max-width:80ch}
</style>

<div class="wrap" id="app"></div>

<script src="js/data.js"></script>
<script src="js/mechanisms.js"></script>
<script src="js/app.js"></script>
